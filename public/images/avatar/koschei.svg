<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="g" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#2f4f2f" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2f4f2f" stop-opacity="0.05"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#0a0a0b" rx="8"/>
  <circle cx="100" cy="100" r="70" fill="url(#g)" stroke="#2f4f2f" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="55" fill="#2f4f2f" fill-opacity="0.1" stroke="#2f4f2f" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="100" y="108" text-anchor="middle" fill="#2f4f2f" fill-opacity="0.6"
        font-family="sans-serif" font-size="32" font-weight="600" filter="url(#glow)">切</text>
</svg>